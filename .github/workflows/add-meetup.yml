name: Submit a meetup
description: Suggest a meetup, conference or group for the map. Submissions are reviewed before they appear.
title: "[Meetup] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please don't include personal contact details here; this issue is public.

  - type: input
    id: name
    attributes:
      label: Meetup name
      placeholder: e.g., BurbSec
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Social
        - Conference
        - Organization / chapter
        - Student group
        - General tech
    validations:
      required: true

  - type: input
    id: type
    attributes:
      label: Focus / topic
      placeholder: e.g., Cybersecurity, AppSec, AI
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Website URL
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: city
    attributes:
      label: City
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true

  - type: input
    id: schedule
    attributes:
      label: Schedule
      placeholder: e.g., Second Thursday of every month, 6:00 PM
    validations:
      required: true

  - type: input
    id: lat
    attributes:
      label: Latitude (optional)

  - type: input
    id: lng
    attributes:
      label: Longitude (optional)

  - type: textarea
    id: description
    attributes:
      label: Description (optional)
